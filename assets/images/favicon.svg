<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="sbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD9EA" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="sbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Bridge Arch Soundwaves -->
  <path d="M15 68 C25 45, 40 32, 50 32 C60 32, 75 45, 85 68" stroke="url(#sbGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#sbGlow)" />
  <path d="M24 72 C32 55, 42 45, 50 45 C58 45, 68 55, 76 72" stroke="url(#sbGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.8" fill="none" />
  <path d="M33 76 C38 64, 44 58, 50 58 C56 58, 62 64, 67 76" stroke="url(#sbGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" fill="none" />
  <!-- Center Core Node / Sound Pulse -->
  <circle cx="50" cy="22" r="5" fill="#7DD9EA" filter="url(#sbGlow)" />
  <circle cx="50" cy="22" r="2.5" fill="#FFFFFF" />
  <!-- Acoustic Wave Bars beneath -->
  <line x1="20" y1="84" x2="20" y2="76" stroke="#7DD9EA" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="30" y1="88" x2="30" y2="72" stroke="#7DD9EA" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="40" y1="92" x2="40" y2="68" stroke="#7DD9EA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="50" y1="95" x2="50" y2="65" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="60" y1="92" x2="60" y2="68" stroke="#7DD9EA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="70" y1="88" x2="70" y2="72" stroke="#7DD9EA" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="80" y1="84" x2="80" y2="76" stroke="#7DD9EA" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>